<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A股交易系统</title>
<script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.prod.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>
<style>
:root {
  --bg: #eaf4ff; --card: rgba(255,255,255,.86); --panel: #ffffff; --border: rgba(59,130,246,.18); --text: #0f172a;
  --muted: #64748b; --accent: #0284c7; --accent2: #06b6d4; --green: #16a34a; --red: #dc2626;
  --up: #ef4444; --down: #22c55e;
  --orange: #f59e0b; --purple: #7c3aed; --glow: rgba(14,165,233,.22);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:var(--text);min-height:100vh;background:
  radial-gradient(circle at 18% 8%, rgba(56,189,248,.26), transparent 34%),
  radial-gradient(circle at 86% 18%, rgba(99,102,241,.18), transparent 30%),
  linear-gradient(135deg,#eef8ff 0%,#f8fbff 45%,#e7f3ff 100%)}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background-image:
  linear-gradient(rgba(14,165,233,.055) 1px, transparent 1px),
  linear-gradient(90deg, rgba(14,165,233,.055) 1px, transparent 1px);
  background-size:34px 34px;mask-image:linear-gradient(to bottom, rgba(0,0,0,.75), transparent 82%)}
#app{display:flex;min-height:100vh}

/* Sidebar */
.sidebar{width:220px;background:rgba(255,255,255,.74);backdrop-filter:blur(18px);border-right:1px solid rgba(14,165,233,.18);box-shadow:12px 0 40px rgba(30,64,175,.08);padding:20px 0;display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:10}
.sidebar .logo{font-size:20px;font-weight:800;padding:0 20px 20px;color:var(--accent);display:flex;align-items:center;gap:8px;text-shadow:0 0 18px rgba(14,165,233,.28)}
.sidebar .nav-item{padding:12px 20px;cursor:pointer;color:var(--muted);font-size:14px;display:flex;align-items:center;gap:10px;transition:all .2s;border-left:3px solid transparent}
.sidebar .nav-item:hover{background:rgba(14,165,233,.08);color:var(--text)}
.sidebar .nav-item.active{background:linear-gradient(90deg,rgba(14,165,233,.16),rgba(6,182,212,.06));color:var(--accent);border-left-color:var(--accent)}
.sidebar .nav-item .icon{font-size:18px;width:24px;text-align:center}
.sidebar .footer{padding:20px;margin-top:auto;font-size:11px;color:var(--muted);border-top:1px solid var(--border)}

/* Main */
.main{margin-left:220px;flex:1;padding:24px 32px;max-width:calc(100vw - 220px)}

/* Page header */
.page-header{margin-bottom:24px}
.page-header h1{font-size:24px;font-weight:700}
.page-header .subtitle{font-size:13px;color:var(--muted);margin-top:4px}

/* Cards */
.cards-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;margin-bottom:24px}
.stat-card{background:linear-gradient(180deg,rgba(255,255,255,.94),rgba(240,249,255,.84));border:1px solid var(--border);border-radius:18px;padding:20px 24px;transition:all .2s;box-shadow:0 14px 34px rgba(30,64,175,.08), inset 0 1px 0 rgba(255,255,255,.9)}
.stat-card:hover{border-color:rgba(14,165,233,.45);transform:translateY(-2px);box-shadow:0 18px 42px rgba(14,165,233,.16)}
.stat-card .label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}
.stat-card .value{font-size:32px;font-weight:800;font-variant-numeric:tabular-nums}
.stat-card .change{font-size:13px;margin-top:4px;font-weight:500}
.stat-card.accent .value{color:var(--accent)}
.green{color:var(--up)} .red{color:var(--down)} .orange{color:var(--orange)} .purple{color:var(--purple)}

/* Cockpit dashboard */
.cockpit-grid{display:grid;grid-template-columns:minmax(0,2fr) minmax(340px,1fr);gap:16px;margin-bottom:20px;align-items:start}
.cockpit-col{display:flex;flex-direction:column;gap:14px;min-width:0}
.cockpit-hero{background:linear-gradient(135deg,rgba(255,255,255,.96),rgba(232,246,255,.9));border:1px solid rgba(14,165,233,.22);border-radius:18px;padding:16px 18px;box-shadow:0 16px 38px rgba(30,64,175,.08)}
.cockpit-title{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.cockpit-title h2{font-size:17px;font-weight:800}.cockpit-title .meta{font-size:12px;color:var(--muted)}
.metric-strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.metric-pill{background:rgba(255,255,255,.78);border:1px solid rgba(14,165,233,.16);border-radius:14px;padding:10px 12px;min-width:0}
.metric-pill .k{font-size:11px;color:var(--muted);margin-bottom:4px}.metric-pill .v{font-size:18px;font-weight:800;font-variant-numeric:tabular-nums}.metric-pill .s{font-size:11px;color:var(--muted);margin-top:2px}
.dense-panel{background:rgba(255,255,255,.86);border:1px solid var(--border);border-radius:16px;padding:14px 16px;box-shadow:0 12px 28px rgba(30,64,175,.06);min-width:0}
.dense-panel h3{font-size:14px;font-weight:750;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.dense-table th,.dense-table td{padding:7px 8px;font-size:12px}.dense-table th{font-size:10px}.dense-table small{font-size:10px;color:var(--muted)}
.dense-list{display:flex;flex-direction:column;gap:8px}.dense-item{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:9px 10px;border:1px solid rgba(14,165,233,.12);background:rgba(248,252,255,.72);border-radius:12px}
.dense-item .name{font-weight:750;font-size:12px}.dense-item .sub{font-size:10px;color:var(--muted);margin-top:2px}.dense-item .num{text-align:right;font-weight:800;font-size:12px;font-variant-numeric:tabular-nums}
.strategy-tags{display:flex;gap:6px;flex-wrap:wrap}.strategy-tags .badge{border-radius:8px;padding:4px 8px}
@media(max-width:1180px){.cockpit-grid{grid-template-columns:1fr}.metric-strip{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* Section */
.section{background:var(--card);backdrop-filter:blur(16px);border:1px solid var(--border);border-radius:18px;padding:20px 24px;margin-bottom:20px;box-shadow:0 16px 38px rgba(30,64,175,.08)}
.section-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.section-header h2{font-size:16px;font-weight:600}
.section-header .actions{display:flex;gap:8px}

/* Table */
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:10px 12px;font-size:13px;border-bottom:1px solid var(--border)}
th{color:var(--muted);font-weight:500;font-size:11px;text-transform:uppercase;letter-spacing:.5px;white-space:nowrap}
td{white-space:nowrap}
tr:hover td{background:rgba(14,165,233,.055)}

/* Badge */
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600}
.badge-buy{background:rgba(34,197,94,.12);color:var(--green)}
.badge-sell{background:rgba(239,68,68,.12);color:var(--red)}
.badge-watch{background:rgba(245,158,11,.12);color:var(--orange)}
.badge-tech{background:rgba(168,85,247,.12);color:var(--purple)}
.badge-info{background:rgba(56,189,248,.12);color:var(--accent)}
.badge-danger{background:rgba(239,68,68,.14);color:var(--red)}
.badge-warning{background:rgba(245,158,11,.14);color:var(--orange)}

/* Buttons */
.btn{background:linear-gradient(135deg,#0ea5e9,#22d3ee);color:#ffffff;border:none;padding:8px 20px;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;transition:all .2s;box-shadow:0 10px 22px rgba(14,165,233,.24)}
.btn:hover{filter:brightness(1.05);transform:translateY(-1px);box-shadow:0 12px 26px rgba(14,165,233,.32)}
.btn:disabled{background:var(--border);color:var(--muted);cursor:not-allowed;transform:none}
.btn-ghost{background:rgba(255,255,255,.62);color:var(--muted);border:1px solid var(--border);box-shadow:none}
.btn-ghost:hover{color:var(--text);border-color:rgba(14,165,233,.35)}
.btn-sm{padding:5px 14px;font-size:12px}

/* Charts */
.charts-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;margin-bottom:20px}
.cockpit-charts{margin-bottom:0}
.chart-box{min-width:0;overflow:hidden;background:var(--card);backdrop-filter:blur(16px);border:1px solid var(--border);border-radius:18px;padding:16px 20px;box-shadow:0 16px 38px rgba(30,64,175,.08)}
.chart-box h3{font-size:13px;font-weight:600;margin-bottom:10px;color:var(--muted)}
.chart-box canvas{width:100%!important;height:460px!important;max-height:480px;min-height:440px}
.cockpit-charts .chart-box canvas{height:320px!important;max-height:340px;min-height:300px}
.chart-heading{display:flex;align-items:center;justify-content:space-between;gap:12px}
.chart-heading small{font-size:10px;font-weight:500;color:#94a3b8}
.pnl-chart-scroll{width:100%;overflow-x:auto;overflow-y:hidden;padding-bottom:6px;overscroll-behavior-x:contain;scrollbar-gutter:stable;-webkit-overflow-scrolling:touch}
.pnl-chart-stage{position:relative;min-width:100%;height:320px}
.pnl-chart-scroll::-webkit-scrollbar{height:8px}
.pnl-chart-scroll::-webkit-scrollbar-track{background:rgba(148,163,184,.12);border-radius:999px}
.pnl-chart-scroll::-webkit-scrollbar-thumb{background:rgba(14,165,233,.32);border-radius:999px}
.pnl-chart-scroll::-webkit-scrollbar-thumb:hover{background:rgba(14,165,233,.5)}
@media(max-width:900px){.charts-row{grid-template-columns:1fr}}

/* Empty */
.empty{text-align:center;padding:48px 20px;color:var(--muted)}
.empty .icon{font-size:48px;margin-bottom:12px}
.empty p{font-size:13px}

/* Filter bar */
.filter-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.filter-bar input,.filter-bar select{background:rgba(255,255,255,.88);border:1px solid var(--border);color:var(--text);padding:6px 12px;border-radius:8px;font-size:13px}
.filter-bar input:focus,.filter-bar select:focus{outline:none;border-color:var(--accent)}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;align-items:end;margin-bottom:12px}
.form-field label{display:block;font-size:11px;color:var(--muted);margin-bottom:5px}
.form-field input,.form-field select{width:100%;background:rgba(248,252,255,.98);border:1px solid rgba(14,165,233,.22);color:var(--text);padding:8px 10px;border-radius:8px;font-size:13px;box-shadow:inset 0 1px 2px rgba(15,23,42,.04)}
.form-field-wide{grid-column:1/-1}
.check-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}
.check-option{display:flex;align-items:flex-start;gap:8px;min-height:38px;padding:9px 10px;border:1px solid rgba(14,165,233,.18);border-radius:8px;background:rgba(248,252,255,.82);cursor:pointer}
.check-option:hover{border-color:rgba(14,165,233,.38);background:rgba(240,249,255,.96)}
.check-option input{width:auto;margin-top:2px;box-shadow:none}
.check-option .name{font-size:13px;font-weight:700;line-height:1.25;color:var(--text)}
.check-option .desc{font-size:11px;color:var(--muted);line-height:1.35;margin-top:2px;white-space:normal}
.form-hint{font-size:12px;color:var(--muted);line-height:1.6}
.modal-mask{position:fixed;inset:0;background:rgba(15,23,42,.44);backdrop-filter:blur(8px);z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px}
.modal-card{width:min(720px,100%);background:linear-gradient(180deg,#ffffff,#f2f9ff);border:1px solid rgba(14,165,233,.26);border-radius:20px;box-shadow:0 26px 90px rgba(15,23,42,.28),0 0 0 1px rgba(255,255,255,.8) inset;padding:20px;opacity:1}
.modal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.modal-header h3{font-size:18px}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:14px}

/* Reason text */
.reason-text{max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;color:var(--muted)}
.reason-text:hover{white-space:normal;overflow:visible;position:relative;background:var(--card);z-index:10;padding:4px 8px;border-radius:6px;border:1px solid var(--border);box-shadow:0 4px 12px rgba(0,0,0,.3)}

/* Progress bar */
.progress-bar{height:6px;background:var(--border);border-radius:3px;overflow:hidden;min-width:60px}
.progress-bar .fill{height:100%;border-radius:3px;transition:width .3s}

/* Loading */
.loading-spin{display:inline-block;width:20px;height:20px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* Concept tags */
.concept-tag{display:inline-block;padding:1px 6px;border-radius:4px;font-size:10px;background:rgba(56,189,248,.08);color:var(--accent);margin-right:3px}
.live-price{display:flex;flex-direction:column;gap:2px;line-height:1.15}
.live-price .price-line{display:flex;align-items:center;gap:6px;font-weight:700;font-variant-numeric:tabular-nums}
.live-dot{width:6px;height:6px;border-radius:999px;background:var(--green);box-shadow:0 0 0 3px rgba(22,163,74,.12);display:inline-block}
.live-price .quote-meta{font-size:10px;color:var(--muted);font-weight:500;white-space:nowrap}

/* Watch monitoring */
.monitor-card{background:linear-gradient(135deg,rgba(239,249,255,.96),rgba(255,255,255,.9));border:1px solid rgba(14,165,233,.2);border-radius:16px;padding:14px 16px;margin:6px 0 10px;white-space:normal;box-shadow:inset 3px 0 0 rgba(14,165,233,.45),0 10px 26px rgba(14,165,233,.08)}
.monitor-header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.monitor-title{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px}
.monitor-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.monitor-block{background:rgba(255,255,255,.74);border:1px solid rgba(14,165,233,.16);border-radius:12px;padding:12px}
.monitor-block h4{font-size:12px;color:var(--muted);margin-bottom:8px;font-weight:600}
.monitor-kv{display:grid;grid-template-columns:90px 1fr;gap:6px 10px;font-size:12px;line-height:1.6}
.monitor-kv .k{color:var(--muted)}
.monitor-note{font-size:12px;line-height:1.7;color:#334155;white-space:normal}
.monitor-list{margin-left:16px;font-size:12px;line-height:1.7;color:#334155}
.monitor-advice{font-size:13px;line-height:1.7;font-weight:600;color:var(--accent);white-space:normal}

/* Stock chart mini */
.mini-chart{width:80px;height:30px}

/* Financial analysis */
.finance-query{display:grid;grid-template-columns:minmax(280px,1fr) auto;gap:14px;align-items:end}
.finance-query textarea{width:100%;min-height:74px;resize:vertical;background:rgba(248,252,255,.98);border:1px solid rgba(14,165,233,.22);color:var(--text);padding:10px 12px;border-radius:8px;font:13px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace}
.finance-query textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(14,165,233,.09)}
.finance-query-actions{display:flex;flex-direction:column;gap:9px;align-items:flex-end}
.finance-toggles{display:flex;gap:14px;font-size:12px;color:var(--muted)}
.finance-toggles label{display:flex;align-items:center;gap:6px;cursor:pointer;white-space:nowrap}
.finance-result{background:rgba(255,255,255,.9);border:1px solid var(--border);border-radius:8px;margin-bottom:16px;overflow:hidden;box-shadow:0 10px 24px rgba(30,64,175,.06)}
.finance-result-header{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;padding:15px 18px;border-bottom:1px solid var(--border);background:rgba(240,249,255,.68)}
.finance-result-title{font-size:17px;font-weight:800}.finance-result-code{font-size:12px;color:var(--muted);margin-left:8px;font-weight:600}
.finance-source{font-size:11px;color:var(--muted);text-align:right;line-height:1.5}
.finance-metric-strip{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border-bottom:1px solid var(--border)}
.finance-metric{padding:12px 16px;border-right:1px solid var(--border);min-width:0}.finance-metric:last-child{border-right:0}
.finance-metric .k{font-size:10px;color:var(--muted);margin-bottom:4px}.finance-metric .v{font-size:17px;font-weight:800;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.finance-body{display:grid;grid-template-columns:minmax(430px,1.2fr) minmax(340px,1fr);gap:0}
.finance-facts,.finance-ai{padding:16px 18px;min-width:0}.finance-ai{border-left:1px solid var(--border);background:rgba(248,252,255,.55)}
.finance-block-title{font-size:12px;font-weight:800;color:var(--muted);margin-bottom:10px}
.finance-facts table th,.finance-facts table td{padding:7px 8px;font-size:12px}.finance-facts table th{font-size:10px}
.finance-ai-conclusion{font-size:14px;font-weight:750;line-height:1.65;margin-bottom:10px;color:#0c4a6e}
.finance-ai-copy{font-size:12px;line-height:1.7;color:#334155;margin-bottom:9px;white-space:normal}
.finance-ai-list{margin:4px 0 10px 18px;font-size:12px;line-height:1.65;color:#334155}
.finance-warning{padding:10px 18px;border-top:1px solid rgba(245,158,11,.22);background:rgba(255,251,235,.72);font-size:11px;color:#92400e;line-height:1.55;white-space:normal}
.finance-error{padding:11px 14px;margin-bottom:14px;border:1px solid rgba(239,68,68,.22);border-radius:8px;background:rgba(254,242,242,.86);color:#991b1b;font-size:12px;line-height:1.55}
@media(max-width:1050px){.finance-body{grid-template-columns:1fr}.finance-ai{border-left:0;border-top:1px solid var(--border)}.finance-metric-strip{grid-template-columns:repeat(2,minmax(0,1fr))}.finance-metric{border-bottom:1px solid var(--border)}}
@media(max-width:720px){
  #app{display:block}.sidebar{position:sticky;top:0;bottom:auto;width:100%;height:auto;padding:0;display:flex;flex-direction:row;align-items:stretch;overflow-x:auto;box-shadow:0 8px 22px rgba(30,64,175,.1)}
  .sidebar .logo,.sidebar .footer{display:none}.sidebar .nav-item{flex:0 0 auto;padding:10px 12px;border-left:0;border-bottom:3px solid transparent;font-size:12px;white-space:nowrap}.sidebar .nav-item.active{border-left-color:transparent;border-bottom-color:var(--accent)}.sidebar .nav-item .icon{font-size:14px;width:18px}
  .main{margin-left:0;max-width:100vw;padding:16px 12px}.page-header{margin-bottom:16px}.page-header h1{font-size:20px}.section{padding:16px 14px}
  .finance-query{grid-template-columns:1fr}.finance-query-actions{align-items:stretch}.finance-query-actions .btn{width:100%}.finance-result-header{flex-direction:column}.finance-source{text-align:left}.finance-metric-strip{grid-template-columns:1fr}.finance-metric{border-right:0}.finance-body{display:block}.finance-facts,.finance-ai{padding:14px}.finance-result-title{font-size:16px}
}
</style>
</head>
<body>
<div id="app">
<div class="sidebar">
  <div class="logo">📈 Trader</div>
  <div class="nav-item" :class="{active:tab==='dashboard'}" @click="tab='dashboard'"><span class="icon">📊</span>仪表盘</div>
  <div class="nav-item" :class="{active:tab==='positions'}" @click="tab='positions'"><span class="icon">💼</span>持仓分析</div>
  <div class="nav-item" :class="{active:tab==='trades'}" @click="tab='trades'"><span class="icon">📜</span>交易记录</div>
  <div class="nav-item" :class="{active:tab==='live'}" @click="tab='live'"><span class="icon">🧾</span>实盘操盘</div>
  <div class="nav-item" :class="{active:tab==='screening'}" @click="tab='screening'"><span class="icon">🔍</span>每日选股</div>
  <div class="nav-item" :class="{active:tab==='financial'}" @click="tab='financial'"><span class="icon">▤</span>财务分析</div>
  <div class="nav-item" :class="{active:tab==='watchlist'}" @click="tab='watchlist'"><span class="icon">👁️</span>自选监控</div>
  <div class="nav-item" :class="{active:tab==='news'}" @click="tab='news'"><span class="icon">📰</span>新闻监控</div>
  <div class="footer">
    <div>🟢 系统运行中</div>
    <div style="margin-top:4px">数据源: 腾讯行情</div>
    <div v-if="freshness">日K: {{freshness.latest_kline_date}}</div>
  </div>
</div>

<div class="main">

  <!-- ============= DASHBOARD ============= -->
  <template v-if="tab==='dashboard'">
    <div class="page-header">
      <h1>📊 交易仪表盘</h1>
      <div class="subtitle">最后更新: {{lastUpdate}}</div>
    </div>

    <div class="cockpit-grid">
      <div class="cockpit-col">
        <div class="cockpit-hero">
          <div class="cockpit-title">
            <h2>🐂 模拟操盘总览</h2>

<script>
const {createApp,ref,computed,onMounted,watch,nextTick} = Vue;

const PIE_COLORS = ['#0ea5e9','#38bdf8','#06b6d4','#14b8a6','#22c55e','#84cc16','#f59e0b','#fb923c'];
const doughnutLeaderLabels = {
  id:'doughnutLeaderLabels',
  afterDatasetsDraw(chart, args, opts){
    if(!opts?.enabled) return;
    const meta = chart.getDatasetMeta(0);
    const dataset = chart.data.datasets[0];
    if(!meta?.data?.length || !dataset?.data?.length) return;
    const {ctx, chartArea} = chart;
    const total = dataset.data.reduce((a,b)=>a+Number(b||0),0);
    if(total <= 0) return;

    const labelW = opts.labelWidth || 116;
    const labelH = opts.labelHeight || 20;
    const labelInset = opts.labelInset || 10;
    const items = meta.data.map((arc, i)=>{
      const value = Number(dataset.data[i]||0);
      if(value <= 0) return null;
      const mid = (arc.startAngle + arc.endAngle) / 2;
      const r = arc.outerRadius;
      const sx = arc.x + Math.cos(mid) * (r + 2);
      const sy = arc.y + Math.sin(mid) * (r + 2);
      const ex = arc.x + Math.cos(mid) * (r + 14);
      const ey = arc.y + Math.sin(mid) * (r + 14);
      const right = Math.cos(mid) >= 0;
      const text = `${chart.data.labels[i]} ${(value/total*100).toFixed(1)}%`;
      return {i, mid, sx, sy, ex, ey, right, text, cx:arc.x, cy:arc.y, r};
    }).filter(Boolean);

    const clamp = (v, min, max)=>Math.max(min, Math.min(max, v));
    const rectsOverlap = (a,b)=>!(a.boxX+labelW+4 < b.boxX || b.boxX+labelW+4 < a.boxX || a.boxY+labelH+4 < b.boxY || b.boxY+labelH+4 < a.boxY);
    for(const it of items){
      const labelR = it.r + (opts.labelDistance || 26);
      const rawX = it.cx + Math.cos(it.mid) * labelR;
      const rawY = it.cy + Math.sin(it.mid) * labelR;
      it.boxX = clamp(rawX - labelW / 2, labelInset, chart.width - labelInset - labelW);
      it.boxY = clamp(rawY - labelH / 2, labelInset, chart.height - labelInset - labelH);
      it.homeX = it.boxX;
      it.homeY = it.boxY;
    }

    // Light collision relaxation: keep labels around the ring, but prevent covering each other.
    for(let pass=0; pass<28; pass++){
      for(let a=0; a<items.length; a++){
        for(let b=a+1; b<items.length; b++){
          const A = items[a], B = items[b];
          if(!rectsOverlap(A,B)) continue;
          const acx = A.boxX + labelW/2, acy = A.boxY + labelH/2;
          const bcx = B.boxX + labelW/2, bcy = B.boxY + labelH/2;
          let dx = acx - bcx, dy = acy - bcy;
          if(Math.abs(dx) < .1 && Math.abs(dy) < .1){ dx = Math.cos(A.mid); dy = Math.sin(A.mid); }
          const len = Math.max(1, Math.hypot(dx, dy));
          const push = 4.5;
          A.boxX += dx/len * push; A.boxY += dy/len * push;
          B.boxX -= dx/len * push; B.boxY -= dy/len * push;
        }
      }
      for(const it of items){
        it.boxX += (it.homeX - it.boxX) * .04;
        it.boxY += (it.homeY - it.boxY) * .04;
        it.boxX = clamp(it.boxX, labelInset, chart.width - labelInset - labelW);
        it.boxY = clamp(it.boxY, labelInset, chart.height - labelInset - labelH);
      }
    }

    for(const it of items){
      it.ly = it.boxY + labelH / 2;
      it.textX = it.boxX + labelW / 2;
      const nearestX = clamp(it.ex, it.boxX, it.boxX + labelW);
      const nearestY = clamp(it.ey, it.boxY, it.boxY + labelH);
      it.lineX = nearestX;
      it.lineY = nearestY;
      it.align = 'left';
    }

    ctx.save();
      ctx.font = '700 11px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif';
    ctx.textBaseline = 'middle';
    for(const it of items){
      const color = dataset.backgroundColor[it.i] || '#38bdf8';
      ctx.strokeStyle = color;
      ctx.globalAlpha = .55;
      ctx.lineWidth = 1.1;
      ctx.beginPath();
      ctx.moveTo(it.sx, it.sy);
      ctx.quadraticCurveTo(it.ex, it.ey, it.lineX, it.lineY);
      ctx.stroke();
      ctx.globalAlpha = 1;

      const selected = chart.$selectedIndex === it.i;
      ctx.fillStyle = selected ? 'rgba(240,249,255,.97)' : 'rgba(255,255,255,.9)';
      ctx.strokeStyle = selected ? color : 'rgba(148,163,184,.16)';
      ctx.lineWidth = selected ? 1.6 : 1;
      const radius = 8;
      ctx.beginPath();
      ctx.roundRect(it.boxX, it.boxY, labelW, labelH, radius);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = '#0f172a';
      ctx.textAlign = 'center';
      ctx.fillText(it.text, it.textX, it.ly);
    }
    ctx.restore();
  }
};
Chart.register(doughnutLeaderLabels);

const app=createApp({
  setup(){

      {key:'cancelled', label:'已取消'},

    // Screen
    const screenRecords = ref([]);
    const screenDates = ref([]);
    const screenDate = ref('');
    const loadedScreenDate = ref('');
    const candidateLifecycle = ref({
      strategy:'candidate_observation.v2', as_of:'', trade_date:'', board:{}, candidate_limit:15,
      promotion_health:{status:'idle',healthy:true,message:''},
      agent_runtime_health:{status:'pending',healthy:true,message:''}, candidates:[], observations:[]
    });
    const activeBoardCandidates = computed(()=>(candidateLifecycle.value.candidates||[]));
    const candidateObservations = computed(()=>(candidateLifecycle.value.observations||[]));

    // On-demand financial analysis
    const financialCodes = ref('');
    const financialRefresh = ref(true);
    const financialIncludeAi = ref(true);
    const financialLoading = ref(false);
    const financialError = ref('');
    const financialResult = ref({items:[],errors:[],ai:{}});

    // Watchlist
    const watchlist = ref([]);
    const watchConfig = ref({items:[],strategies:{washout_start:{name:'洗盘/启动监控'}}});
    const watchModalOpen = ref(false);
    const watchForm = ref({code:'',name:'',strategies:['washout_start'],time_windows:'09:30-11:30,13:00-15:05',interval_minutes:60});
    const freshness = ref(null);

    // Today summary
    const todaySummary = ref(null);
    const closedPositions = ref({items:[],total:0,summary:{}});
    const todayPnl = ref(0);
    const todayPnlDate = ref('');
    const reconcileStatus = ref(null);

    // News monitor
    const newsEvents = ref([]);
    const selectedNewsCode = ref('');

    // Helpers
    const fmt = v => (v||0).toLocaleString('zh-CN',{minimumFractionDigits:0,maximumFractionDigits:0});
    const fmt2 = v => Number(v||0).toFixed(2);
    const financeNumber = (v, digits=2) => {
      if(v === null || v === undefined || v === '') return '-';
      const n = Number(v);
      return Number.isFinite(n) ? n.toLocaleString('zh-CN',{minimumFractionDigits:digits,maximumFractionDigits:digits}) : '-';
    };
    const financePercent = v => (v === null || v === undefined || v === '') ? '-' : financeNumber(v,2)+'%';
    const formatPe = v => {
      if(v === null || v === undefined || v === '' || Number(v) === 0) return '-';
      return Number(v) < 0 ? financeNumber(v,2)+'（亏损）' : financeNumber(v,2);
    };
    const valueLabelName = value => ({
      overvalued:'估值偏高',reasonable_high:'估值略高',reasonable:'估值中性',

    }[value] || value || '未分类');
    const hasMonitoring = m => !!(m && Object.keys(m).length);

      if(v === null || v === undefined || v === '') return '-';

    const monitorCards = m => {
      if(!hasMonitoring(m)) return [];
      if(Array.isArray(m.monitors) && m.monitors.length) return m.monitors;

      return [{
        id:'legacy-washout', title:m.label || '洗盘监控', phase:m.washed_out_pattern?.current_phase || r.phase || '跟踪中',
        advice:m.washed_out_pattern?.next_trigger || '等待下一次监控信号', summary:r.summary || '',
        key_levels:[
          {name:'止损', value:m.key_levels?.stop_loss, note:m.key_levels?.stop_loss_note},
          {name:'78.6%支撑', value:m.key_levels?.support_78_6, note:m.key_levels?.support_note},

        ],
        metrics:[{name:'涨跌幅', value:r.change_pct, unit:'%'},{name:'大阳量占比', value:r.vol_vs_big_yang_pct, unit:'%'}],
        signals:[{name:'结束信号', value:m.washed_out_pattern?.end_signal},{name:'失败信号', value:m.washed_out_pattern?.fail_signal}],

    const normalizeTags = tags => {

    const promotionHealthClass = s => s==='failed'?'badge-danger':s==='pending'?'badge-warning':'badge-buy';
    const candidateRouteName = r => ({early_start:'前置启动',strong_continuation:'强势延续'}[r] || (r ? '历史：'+r : '待识别'));
    const candidateSourceName = s => ({daily_final_selection:'每日选股',intraday_radar:'盘中雷达',opening_auction_watch:'集合竞价',intraday_promotion:'盘中晋升',strategic_theme_pool:'固定战略观察'}[s] || s || '未知');
    const candidateSourceClass = s => ({intraday_radar:'badge-tech',opening_auction_watch:'badge-warning',intraday_promotion:'badge-buy',daily_final_selection:'badge-info',strategic_theme_pool:'badge-info'}[s] || 'badge-info');
    const candidateSourceSummary = candidate => {
      const sources = Array.isArray(candidate?.sources) && candidate.sources.length ? candidate.sources : [candidate?.primary_source];
      return sources.filter(Boolean).map(candidateSourceName).join('+') || '未知来源';
    };
    const candidateTime = value => {
      if(!value) return '';
      const text = String(value);
      return text.length>=16 ? text.slice(5,16) : text;
    };
    const normalizeWatchStrategies = value => {
      if(Array.isArray(value)) return value.filter(Boolean);
      if(typeof value === 'string') return value.split(',').map(x=>x.trim()).filter(Boolean);
      return [];
    };
    const watchStrategyNames = value => normalizeWatchStrategies(value).map(key => watchConfig.value.strategies?.[key]?.name || key);
    const newsGroups = computed(()=>{
      const order = {}, names = {};
      (account.value.positions||[]).forEach((p, i)=>{ order[p.code] = i; names[p.code] = p.name; });
      const map = {};
      for(const e of (newsEvents.value||[])){
        const code = String(e.code || 'UNKNOWN');
        if(!map[code]){
          map[code] = {code, name: e.name || names[code] || '', events: [], scoreSum: 0, highCount: 0, order: order[code] ?? 999};
        }
        if(!map[code].name) map[code].name = e.name || names[code] || '';
        map[code].events.push(e);
        map[code].scoreSum += Number(e.score || 0);
        if(e.risk_level === 'high' || Number(e.score || 0) <= -2) map[code].highCount += 1;
      }
      return Object.values(map).map(g=>{
        g.events.sort((a,b)=>String(b.publish_at||b.created_at||'').localeCompare(String(a.publish_at||a.created_at||'')));
        return g;
      }).sort((a,b)=>a.order-b.order || b.highCount-a.highCount || b.events.length-a.events.length);
    });
    const selectedNewsGroup = computed(()=>{
      const groups = newsGroups.value || [];
      if(!groups.length) return null;
      return groups.find(g=>g.code === selectedNewsCode.value) || groups[0];
    });

        price: isEdit ? (it.filled_price || it.suggested_price || 0) : (it.suggested_price || 0),

      financialError.value = '';

          headers:{'Content-Type':'application/json'},

            refresh:financialRefresh.value,

        });

        financialResult.value = data;
        const partialErrors = (data.errors||[]).map(x=>(x.code?x.code+'：':'')+(x.message||'查询失败'));
        if(!response.ok && !data.items?.length){
          financialError.value = data.message || partialErrors.join('；') || '财务查询失败';
        }else if(partialErrors.length){
          financialError.value = partialErrors.join('；');
        }
      }catch(e){
        financialError.value = '财务查询失败：'+e;
        financialResult.value = {items:[],errors:[],ai:{}};

        financialLoading.value = false;

    async function drawPnlChart(){
      try{
        const r = await fetch('/api/pnl-history?days=30');
        const d = await r.json();
        if(!d.equity?.length) return;
        const latest = d.equity[d.equity.length - 1];
        todayPnl.value = Math.round(Number(latest.daily_profit ?? latest.total_profit ?? 0));
        todayPnlDate.value = latest.date || '';
        const ctx = document.getElementById('chartPnl');
        const scroll = document.getElementById('pnlChartScroll');
        const stage = document.getElementById('pnlChartStage');
        if(!ctx || !scroll || !stage) return;
        const previousScrollLeft = scroll.scrollLeft;
        const wasAtLatest = scroll.scrollWidth - scroll.clientWidth - scroll.scrollLeft < 24;
        const chartWidth = Math.max(scroll.clientWidth, 72 + d.equity.length * 48);
        stage.style.width = chartWidth+'px';
        if(scroll._pnlScaleFrame) cancelAnimationFrame(scroll._pnlScaleFrame);
        if(scroll._pnlScaleHandler) scroll.removeEventListener('scroll',scroll._pnlScaleHandler);
        const existing = Chart.getChart('chartPnl');
        if(existing) existing.destroy();
        const profits = d.equity.map(x=>Math.round(Number(x.daily_profit ?? x.total_profit ?? 0)));
        const latestLeft = Math.max(0,chartWidth-scroll.clientWidth);
        const targetScrollLeft = !scroll.dataset.ready || wasAtLatest
          ? latestLeft
          : Math.min(previousScrollLeft,latestLeft);
        scroll.scrollLeft = targetScrollLeft;
        const visibleProfits = left=>{
          if(chartWidth <= scroll.clientWidth+1) return profits;
          const plotInset = 56;
          const pointWidth = Math.max(1,(chartWidth-plotInset-16)/profits.length);
          const start = Math.max(0,Math.floor((left-plotInset)/pointWidth));
          const end = Math.min(profits.length,Math.ceil((left+scroll.clientWidth-plotInset)/pointWidth));
          return profits.slice(start,Math.max(start+1,end));
        };
        const scaleForValues = values=>{
          const low = Math.min(0,...values);
          const high = Math.max(0,...values);
          const magnitude = Math.max(Math.abs(low),Math.abs(high),1);
          const padding = Math.max(50,magnitude*.15);
          return {
            min:low<0 ? Math.floor((low-padding)/100)*100 : 0,
            max:high>0 ? Math.ceil((high+padding)/100)*100 : Math.ceil(padding/100)*100,
          };
        };
        const initialScale = scaleForValues(visibleProfits(targetScrollLeft));
        const chart = new Chart(ctx,{
          type:'bar',
          data:{
            labels: d.equity.map(x=>String(x.date||'').slice(5)),
            datasets:[{
              label:'每日盈亏',
              data: profits,
              backgroundColor: profits.map(v=>v>=0?'rgba(239,68,68,.18)':'rgba(34,197,94,.18)'),
              borderColor: profits.map(v=>v>=0?'rgba(239,68,68,.45)':'rgba(34,197,94,.45)'),
              borderWidth:1,
              borderRadius:8,
              maxBarThickness:28,
            }]
          },
          options:{
            responsive:true,
            maintainAspectRatio:false,
            plugins:{
              legend:{display:false},
              tooltip:{callbacks:{
                title:items=>items.length ? String(d.equity[items[0].dataIndex]?.date||'') : '',
                label:ctx=>'¥'+Math.round(ctx.raw).toLocaleString(),
              }},
              datalabels:{
                color:'#334155',
                anchor:'center',
                align:'center',
                font:{size:12,weight:'700'},
                formatter:v=>Math.round(v).toLocaleString('zh-CN'),
              },
            },
            scales:{
              x:{ticks:{color:'#64748b',autoSkip:false,maxRotation:0,minRotation:0},grid:{display:false},border:{display:false}},
              y:{min:initialScale.min,max:initialScale.max,ticks:{color:'#64748b',callback:v=>(v>=0?'+':'')+'¥'+(Math.abs(v)/10000).toFixed(1)+'万'},grid:{color:'rgba(14,165,233,.12)',lineWidth:1},border:{display:false}}
            }
          }
        });
        const updateVisibleScale = ()=>{
          const nextScale = scaleForValues(visibleProfits(scroll.scrollLeft));
          if(chart.options.scales.y.min===nextScale.min && chart.options.scales.y.max===nextScale.max) return;
          chart.options.scales.y.min = nextScale.min;
          chart.options.scales.y.max = nextScale.max;
          chart.update('none');
        };
        scroll._pnlScaleHandler = ()=>{
          if(scroll._pnlScaleFrame) cancelAnimationFrame(scroll._pnlScaleFrame);
          scroll._pnlScaleFrame = requestAnimationFrame(updateVisibleScale);
        };
        scroll.addEventListener('scroll',scroll._pnlScaleHandler,{passive:true});
        requestAnimationFrame(()=>{
          scroll.scrollLeft = targetScrollLeft;
          scroll.dataset.ready = 'true';
          updateVisibleScale();
        });
      }catch(e){}
    }

    // Tab watcher
    watch(tab, async (t)=>{
      await nextTick();
      if(t==='dashboard'){ await loadCandidateLifecycle(); drawPieChart(); drawPnlChart(); }

      screenRecords,screenDates,screenDate,loadedScreenDate,candidateLifecycle,activeBoardCandidates,candidateObservations,
      financialCodes,financialRefresh,financialIncludeAi,financialLoading,financialError,financialResult,
      watchlist,watchConfig,watchModalOpen,watchForm,freshness,todaySummary,closedPositions,todayPnl,todayPnlDate,reconcileStatus,newsEvents,newsGroups,selectedNewsCode,selectedNewsGroup,
      fmt,fmt2,financeNumber,financePercent,formatPe,valueLabelName,hasMonitoring,formatMonitorValue,monitorCards,latestReviewDate,latestReview,todayUnrealized,realizedPnl,displayUnrealized,displayRealized,normalizeTags,categoryName,categoryClass,liveStatusName,liveStatusClass,watchStrategyNames,candidateStateName,promotionHealthName,promotionHealthClass,candidateRouteName,candidateSourceName,candidateSourceClass,candidateSourceSummary,candidateTime,
      loadOrders,loadLatestOrders,loadAllOrders,loadLiveIntents,openLiveFill,closeLiveFill,submitLiveFill,cancelLiveIntent,loadScreen,loadCandidateLifecycle,runScreen,runFinancialAnalysis,loadWatchlist,openWatchModal,closeWatchModal,saveWatchItem,editWatchItem,deleteWatchItem,loadNewsEvents,runNewsScan,
    };
  }
});
